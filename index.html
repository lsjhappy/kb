<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>万能书</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:#070b14;color:#e6edf7;overflow:hidden}
/* 背景光晕 */
body::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;z-index:0}
body::before{width:520px;height:520px;background:#0e7490;top:-180px;left:-140px}
body::after{width:460px;height:460px;background:#4338ca;bottom:-200px;right:-120px}
.grid{position:fixed;inset:0;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:46px 46px;mask-image:radial-gradient(circle at 50% 40%,#000 40%,transparent 78%)}

.card{position:relative;z-index:1;width:100%;max-width:392px;
  background:rgba(15,23,42,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(148,163,184,.16);border-radius:22px;
  padding:38px 30px 30px;
  box-shadow:0 26px 70px -18px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.03) inset;
  animation:in .5s cubic-bezier(.2,.8,.25,1)}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}

.mark{width:54px;height:54px;margin:0 auto 18px;border-radius:15px;
  background:linear-gradient(140deg,#22d3ee,#0e7490 55%,#4338ca);
  display:flex;align-items:center;justify-content:center;font-size:25px;
  box-shadow:0 10px 26px -8px rgba(34,211,238,.55)}
h1{font-size:19px;font-weight:700;text-align:center;letter-spacing:.5px}
.sub{font-size:12.5px;color:#8b9ab3;text-align:center;margin:7px 0 26px}

.field{display:flex;align-items:center;gap:10px;background:rgba(2,6,23,.6);
  border:1px solid rgba(148,163,184,.18);border-radius:13px;padding:0 13px;
  margin-bottom:13px;transition:.18s;height:50px}
.field:focus-within{border-color:#22d3ee;background:rgba(2,6,23,.85);
  box-shadow:0 0 0 3px rgba(34,211,238,.13)}
.ico{font-size:14px;opacity:.55;flex:0 0 auto}
.field input{flex:1;min-width:0;background:none;border:none;outline:none;
  color:#e6edf7;font-size:14.5px;font-family:inherit;height:100%}
.field input::placeholder{color:#5b6b83}
.eye{background:none;border:none;cursor:pointer;font-size:17px;opacity:.75;padding:4px;line-height:1}
.eye:hover{opacity:1}

.row{display:flex;align-items:center;justify-content:space-between;margin:2px 0 20px}
.remember{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#8b9ab3;cursor:pointer;user-select:none}
.remember input{appearance:none;-webkit-appearance:none;width:16px;height:16px;
  border:1.5px solid rgba(148,163,184,.45);border-radius:5px;background:rgba(2,6,23,.6);
  cursor:pointer;position:relative;transition:.15s;flex:0 0 auto}
.remember input:checked{background:linear-gradient(135deg,#22d3ee,#0ea5e9);border-color:#22d3ee}
.remember input:checked::after{content:'';position:absolute;left:4.5px;top:1.5px;
  width:4px;height:8px;border:solid #04121a;border-width:0 2px 2px 0;transform:rotate(42deg)}

.btn{width:100%;height:50px;border:none;border-radius:13px;cursor:pointer;
  font-size:15px;font-weight:700;letter-spacing:2px;color:#04121a;font-family:inherit;
  background:linear-gradient(135deg,#22d3ee,#38bdf8 60%,#0ea5e9);
  box-shadow:0 12px 28px -10px rgba(34,211,238,.7);transition:.18s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:none}
.btn:disabled{opacity:.6;cursor:default;transform:none}

.msg{text-align:center;font-size:12.5px;margin-top:14px;min-height:17px;color:#fb7185}
.shake{animation:sh .38s}
@keyframes sh{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

.foot{text-align:center;font-size:11px;color:#475569;margin-top:22px;line-height:1.7}
.spin{width:15px;height:15px;border:2px solid rgba(4,18,26,.3);border-top-color:#04121a;
  border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:7px;
  animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media(max-width:420px){.card{padding:32px 22px 26px;border-radius:19px}h1{font-size:17.5px}}
</style>
</head>
<body>
<div class="grid"></div>
<main class="card" id="card">
  <div class="mark">◈</div>
  <h1>万能书</h1>
  <p class="sub">私密 · 登录后查看</p>
  <form id="f" autocomplete="on" novalidate>
    <label class="field"><span class="ico">👤</span>
      <input id="u" type="text" placeholder="账号" autocomplete="username" spellcheck="false">
    </label>
    <label class="field"><span class="ico">🔒</span>
      <input id="p" type="password" placeholder="密码" autocomplete="current-password">
      <button type="button" class="eye" id="eye" aria-label="显示密码">👁</button>
    </label>
    <div class="row">
      <label class="remember"><input type="checkbox" id="r"> 记住账号</label>
    </div>
    <button class="btn" id="go" type="submit">登　录</button>
    <p class="msg" id="msg"></p>
  </form>
</main>

const SALT_B64 = "awO8XGTwQlmukLDDuZ1tew==";
const IV_B64 = "v++hZl/vnbkE+sw9";
const ITER = 200000;

const $ = (id) => document.getElementById(id);
const b64d = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const enc = new TextEncoder();

$("eye").onclick = () => {
  const p = $("p");
  p.type = p.type === "password" ? "text" : "password";
  $("eye").textContent = p.type === "password" ? "👁" : "🙈";
};

// 记住账号（只存账号，不存密码）
try {
  const ru = localStorage.getItem("kb_user");
  if (ru) { $("u").value = ru; $("r").checked = true; $("p").focus(); }
} catch (e) {}

async function unlock() {
  const user = $("u").value.trim();
  const pass = $("p").value;
  const msg = $("msg"), btn = $("go");
  msg.textContent = "";

  if (!user || !pass) {
    msg.textContent = "账号和密码都要填";
    $("card").classList.add("shake");
    setTimeout(() => $("card").classList.remove("shake"), 400);
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>解密中…';

  try {
    const base = await crypto.subtle.importKey(
      "raw", enc.encode(user + ":" + pass), "PBKDF2", false, ["deriveKey"]);

    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64d(SALT_B64), iterations: ITER, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);

    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64d(IV_B64) }, key, b64d(CT_B64));

    if ($("r").checked) {
      try { localStorage.setItem("kb_user", user); } catch (e) {}
    }

    const html = new TextDecoder().decode(plain);
    btn.innerHTML = "已解锁";
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "登　录";
    msg.textContent = "账号或密码不对";
    $("card").classList.add("shake");
    setTimeout(() => $("card").classList.remove("shake"), 400);
    $("p").value = "";
    $("p").focus();
  }
}

$("f").addEventListener("submit", (e) => { e.preventDefault(); unlock(); });
</script>
