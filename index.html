<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>万能书</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:#06090f;color:#e8eef8;overflow:hidden}

/* 背景 */
.glow{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.glow i{position:absolute;display:block;border-radius:50%;filter:blur(100px);opacity:.55}
.glow i:nth-child(1){width:580px;height:580px;background:#0891b2;top:-200px;left:-140px}
.glow i:nth-child(2){width:540px;height:540px;background:#4f46e5;bottom:-220px;right:-140px}
.glow i:nth-child(3){width:420px;height:420px;background:#22d3ee;top:34%;left:50%;opacity:.13}
.grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:52px 52px;
  -webkit-mask-image:radial-gradient(circle at 50% 42%,#000 30%,transparent 76%);
  mask-image:radial-gradient(circle at 50% 42%,#000 30%,transparent 76%)}

/* 卡片 */
.card{position:relative;z-index:1;width:100%;max-width:392px;
  background:linear-gradient(180deg,rgba(17,24,39,.86),rgba(11,16,26,.9));
  -webkit-backdrop-filter:blur(20px) saturate(1.2);backdrop-filter:blur(20px) saturate(1.2);
  border:1px solid rgba(148,163,184,.14);border-radius:22px;
  padding:42px 34px 26px;
  box-shadow:0 30px 70px -24px rgba(0,0,0,.9),
             0 0 0 1px rgba(255,255,255,.02) inset,
             0 1px 0 rgba(255,255,255,.05) inset;
  animation:in .45s cubic-bezier(.21,.9,.28,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.mark{width:56px;height:56px;margin:0 auto 22px;border-radius:17px;position:relative;
  background:linear-gradient(155deg,#2ed3ea 0%,#0e8cb0 55%,#0a6285 100%);
  display:flex;align-items:center;justify-content:center;
  color:#ffffff;
  box-shadow:0 14px 32px -12px rgba(34,211,238,.7),
             0 1px 0 rgba(255,255,255,.3) inset,
             0 0 0 1px rgba(255,255,255,.08)}
.mark::after{content:'';position:absolute;inset:1px;border-radius:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 60%);
  pointer-events:none}

h1{font-size:19px;font-weight:650;text-align:center;letter-spacing:3px;color:#f1f5f9}
h1{margin-bottom:30px}

/* 输入 */
.field{position:relative;display:flex;align-items:center;gap:11px;
  background:rgba(2,6,23,.55);border:1px solid rgba(148,163,184,.15);border-radius:12px;
  padding:0 13px;margin-bottom:12px;height:50px;
  transition:border-color .18s,box-shadow .18s,background .18s}
.field:focus-within{border-color:rgba(34,211,238,.65);background:rgba(2,6,23,.8);
  box-shadow:0 0 0 3px rgba(34,211,238,.1)}
.field .ico{flex:0 0 auto;display:flex;align-items:center;color:#54637b;transition:color .18s}
.field:focus-within .ico{color:#22d3ee}
.field input{flex:1;min-width:0;height:100%;background:none;border:none;outline:none;
  color:#e8eef8;font-size:14.5px;font-family:inherit;letter-spacing:.3px}
.field input::placeholder{color:#4d5b72;letter-spacing:.2px}

/* 干掉浏览器自动填充的黄底 */
.field input:-webkit-autofill,
.field input:-webkit-autofill:hover,
.field input:-webkit-autofill:focus,
.field input:-webkit-autofill:active{
  -webkit-text-fill-color:#e8eef8 !important;
  -webkit-box-shadow:0 0 0 1000px #0a1120 inset !important;
  box-shadow:0 0 0 1000px #0a1120 inset !important;
  caret-color:#22d3ee;
  transition:background-color 100000s ease-in-out 0s}

.eye{flex:0 0 auto;width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  background:none;border:none;border-radius:8px;cursor:pointer;color:#54637b;
  transition:color .15s,background .15s}
.eye:hover{color:#cbd5e1;background:rgba(148,163,184,.1)}

/* 记住账号 */
.row{display:flex;align-items:center;justify-content:space-between;margin:4px 0 22px;padding:0 2px}
.remember{display:flex;align-items:center;gap:8px;font-size:12px;color:#6b7a92;
  cursor:pointer;user-select:none;transition:color .15s}
.remember:hover{color:#94a3b8}
.remember input{appearance:none;-webkit-appearance:none;width:15px;height:15px;flex:0 0 auto;
  border:1.5px solid rgba(148,163,184,.4);border-radius:4.5px;background:rgba(2,6,23,.6);
  cursor:pointer;position:relative;transition:.15s}
.remember input:checked{background:linear-gradient(135deg,#22d3ee,#0ea5e9);border-color:#22d3ee}
.remember input:checked::after{content:'';position:absolute;left:4px;top:1px;
  width:4px;height:8px;border:solid #04121a;border-width:0 1.8px 1.8px 0;transform:rotate(42deg)}

/* 按钮 */
.btn{width:100%;height:50px;border:none;border-radius:12px;cursor:pointer;font-family:inherit;
  font-size:14.5px;font-weight:650;letter-spacing:6px;text-indent:6px;color:#04121a;
  background:linear-gradient(135deg,#22d3ee,#0fa6e0);
  box-shadow:0 12px 26px -14px rgba(34,211,238,.7);
  transition:filter .18s,transform .12s,box-shadow .18s}
.btn:hover{filter:brightness(1.07);box-shadow:0 14px 30px -14px rgba(34,211,238,.85)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.65;cursor:default;transform:none;filter:none}

.msg{text-align:center;font-size:12px;color:#fb7185;letter-spacing:.2px}
.msg:empty{margin-top:0;display:none}
.msg:not(:empty){margin-top:13px}
.shake{animation:sh .36s}
@keyframes sh{0%,100%{transform:none}22%{transform:translateX(-7px)}45%{transform:translateX(6px)}
  68%{transform:translateX(-4px)}85%{transform:translateX(2px)}}
.spin{width:14px;height:14px;border:2px solid rgba(4,18,26,.28);border-top-color:#04121a;
  border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:8px;
  animation:rot .65s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

@media(max-width:420px){
  body{padding:18px}
  .card{padding:34px 24px 26px;border-radius:18px}
  h1{font-size:18px}
}
</style>
</head>
<body>
<div class="glow"><i></i><i></i><i></i></div>
<div class="grid"></div>

<main class="card" id="card">
  <div class="mark">
    <svg width="31" height="31" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 7.2C10.2 5.6 7.9 4.9 4.8 4.9v12.4c3.1 0 5.4.7 7.2 2.3 1.8-1.6 4.1-2.3 7.2-2.3V4.9c-3.1 0-5.4.7-7.2 2.3z"/>
      <path d="M12 7.2v12.4"/>
    </svg>
  </div>
  <h1>万能书</h1>

  <form id="f" novalidate>
    <label class="field">
      <span class="ico">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/>
          <path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
      </span>
      <input id="u" type="text" placeholder="账号" autocomplete="username"
             autocapitalize="off" autocorrect="off" spellcheck="false">
    </label>

    <label class="field">
      <span class="ico">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      </span>
      <input id="p" type="password" placeholder="密码" autocomplete="current-password">
      <button type="button" class="eye" id="eye" aria-label="显示密码">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/>
          <circle cx="12" cy="12" r="2.8"/></svg>
      </button>
    </label>

    <div class="row">
      <label class="remember"><input type="checkbox" id="r"> 记住账号</label>
    </div>

    <button class="btn" id="go" type="submit">登 录</button>
    <p class="msg" id="msg"></p>
  </form>
</main>

const SALT_B64 = "E2dgPLCusENmXjQRiMY+3g==";
const IV_B64 = "Rd7jYikEedZepBYt";
const ITER = 200000;

const $ = (id) => document.getElementById(id);
const b64d = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const enc = new TextEncoder();

const EYE_OPEN = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></svg>';
const EYE_OFF  = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 3l18 18"/><path d="M10.6 6.1A9.9 9.9 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3.1 3.7"/><path d="M6.3 7.4A17 17 0 0 0 2 12s3.6 6 10 6a9.6 9.6 0 0 0 3.9-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';

$("eye").onclick = () => {
  const p = $("p");
  const show = p.type === "password";
  p.type = show ? "text" : "password";
  $("eye").innerHTML = show ? EYE_OFF : EYE_OPEN;
  p.focus();
};

try {
  const ru = localStorage.getItem("kb_user");
  if (ru) { $("u").value = ru; $("r").checked = true; $("p").focus(); }
} catch (e) {}

function fail(text) {
  $("msg").textContent = text;
  $("card").classList.add("shake");
  setTimeout(() => $("card").classList.remove("shake"), 400);
}

async function unlock() {
  const user = $("u").value.trim();
  const pass = $("p").value;
  const btn = $("go");
  $("msg").textContent = "";

  if (!user || !pass) { fail("账号和密码都要填"); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>解密中';

  try {
    const base = await crypto.subtle.importKey(
      "raw", enc.encode(user + ":" + pass), "PBKDF2", false, ["deriveKey"]);

    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64d(SALT_B64), iterations: ITER, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);

    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64d(IV_B64) }, key, b64d(CT_B64));

    if ($("r").checked) {
      try { localStorage.setItem("kb_user", user); } catch (e) {}
    }

    const html = new TextDecoder().decode(plain);
    btn.innerHTML = "已解锁";
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "登 录";
    fail("账号或密码不对");
    $("p").value = "";
    $("p").focus();
  }
}

$("f").addEventListener("submit", (e) => { e.preventDefault(); unlock(); });
</script>
